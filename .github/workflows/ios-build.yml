# Builds the MemProbe measurement app for iOS and publishes an UNSIGNED .ipa.
# Sign it locally with Sideloadly / AltServer / SideStore using your own Apple ID.
#
# Free and unlimited on PUBLIC repos. On private repos macOS burns included
# minutes at a 10x multiplier (2,000 free = 200 macOS minutes/month).

name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on the portable core: ~2 minutes on a free Linux runner
  # instead of ~20 on macOS. Most logic bugs get caught here.
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      # gcc-multilib lets the guest test build a static i386 glibc binary and
      # compare xrun against the native run -- the 32-bit arena's oracle.
      - name: 32-bit toolchain
        run: sudo apt-get install -y --no-install-recommends gcc-multilib || true
      - name: Build and test core
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-host -j"$(nproc)"
          ctest --test-dir build-host --output-on-failure 2>&1 | tee /tmp/ctest.log

      # The dynarec only runs on ARM64. The Linux runner is x86, so it runs an
      # aarch64 cross-build under qemu-user: the golden vectors through the JIT,
      # and the guest programs (i386 and x86-64) end to end.
      - name: Dynarec under qemu-aarch64
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cmake -S . -B build-a64 -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-linux.cmake -DCMAKE_BUILD_TYPE=Release -DWINIOS_D12MT=OFF
          cmake --build build-a64 -j"$(nproc)" --target test_selftest xrun
          Q="qemu-aarch64 -L /usr/aarch64-linux-gnu"
          $Q build-a64/test_selftest
          cd tests/guest
          for g in hello libc_hello hello32; do
            got=$($Q ../../build-a64/xrun ./$g); exp=$(cat $g.expected)
            [ "$got" = "$exp" ] && echo "ok   $g (jit)" || { echo "FAIL $g (jit)"; echo "$got"; exit 1; }
          done
          if gcc -m32 -static -O2 -o /tmp/lh32 libc_hello.c 2>/dev/null; then
            exp=$(/tmp/lh32 x y || true); got=$($Q ../../build-a64/xrun /tmp/lh32 x y || true)   # exits 3 by design
            [ "$got" = "$exp" ] && echo "ok   libc_hello i386 glibc (jit)" || { echo "FAIL libc_hello i386 (jit)"; echo "$got"; exit 1; }
          fi

      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E "FAILED|mismatch|x86=|stopped |Errors while" /tmp/ctest.log \
            | head -30 | while IFS= read -r l; do echo "::error::${l}"; done || true
          tail -n 60 /tmp/ctest.log

      # The GPU probe app ships MSL that d12mt generated from probe.hlsl. If
      # d12mt's output changed, the checked-in copy must change with it, or the
      # iPad would be testing yesterday's compiler.
      - name: GPU probe shaders are current
        if: always()
        run: |
          set +e
          rc=0
          for src in probe.vs.cso probe.ps.cso probe11.vs.dxbc probe11.ps.dxbc probe9.vs.d3dbc probe9.ps.d3dbc; do
            name=${src%.*}
            ./build-host/gpu/d12mt/d12mt-shaderc gpu/d12mt/tests/shaders/$src -o /tmp/$name.msl 2>/dev/null
            if ! diff -u tools/memprobe/Host/Shaders/$name.msl /tmp/$name.msl > /tmp/pdiff.txt; then
              echo "::error::tools/memprobe/Host/Shaders/$name.msl is stale; regenerate with d12mt-shaderc"
              head -20 /tmp/pdiff.txt | while IFS= read -r l; do echo "::error::${l}"; done
              rc=1
            fi
          done
          exit $rc

      # Vectors are recorded from this runner's real CPU. If the interpreter
      # changed, they must be regenerated in the same commit -- a stale
      # recording quietly stops testing whatever just changed.
      - name: Golden vectors are current
        if: always()
        run: |
          set +e
          ./build-host/difftest --emit-golden /tmp/golden.c >/dev/null
          diff -u core/src/golden_vectors.c /tmp/golden.c > /tmp/gdiff.txt
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::golden_vectors.c differs from this runner's recording"
            head -40 /tmp/gdiff.txt > /tmp/gd40.txt
            while IFS= read -r l; do echo "::error::${l}"; done < /tmp/gd40.txt
            exit 1
          fi
          echo "golden vectors match the CI runner's CPU"

  ios:
    # Pinned, not macos-latest: a silent image bump changes the SDK underneath us.
    runs-on: macos-26
    timeout-minutes: 60
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # The CPU core has no Xcode project yet; compile it for iOS arm64 here so
      # Apple clang on arm64 checks it on every push, not just Linux gcc.
      # Makefiles rather than the Xcode generator: predictable output paths,
      # which project.yml hardcodes in LIBRARY_SEARCH_PATHS.
      - name: Build xcore + Zydis for iOS arm64
        run: |
          # d12mt (and dxil-spirv / SPIRV-Cross under it) is built and tested
          # on the Linux job; its iOS cross-build is a separate step to come.
          cmake -S . -B build-xcore-ios \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release -DWINIOS_D12MT=OFF
          cmake --build build-xcore-ios --target xcore_golden -j3
          echo "--- static libs produced ---"
          find build-xcore-ios -name '*.a' | sed 's/^/  /'

      # Apple silicon: the dynarec natively, against the silicon recordings.
      - name: Dynarec on Apple silicon (golden replay)
        run: |
          set +e
          cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release -DWINIOS_D12MT=OFF 2>&1 | tail -3
          cmake --build build-mac -j3 --target test_selftest test_arena32 2>&1 | grep -E "error|warning: |Built target" | head -20
          uname -m; sysctl -n machdep.cpu.brand_string || true
          out=$(./build-mac/test_selftest 2>&1); rc=$?
          echo "$out" | tail -30 | while IFS= read -r l; do echo "::notice::jit: ${l}"; done
          out2=$(XCORE_JIT=0 ./build-mac/test_selftest 2>&1); rc2=$?
          echo "$out2" | tail -3 | while IFS= read -r l; do echo "::notice::interp: ${l}"; done
          ./build-mac/test_arena32; rc3=$?
          echo "rc jit=$rc interp=$rc2 arena=$rc3"
          [ $rc -eq 0 ] && [ $rc2 -eq 0 ] && [ $rc3 -eq 0 ]

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec tools/memprobe/project.yml --project tools/memprobe

      - name: Stamp build number with the commit
        run: plutil -replace CFBundleVersion -string "$(git rev-parse --short HEAD)" tools/memprobe/Host/Info.plist

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project tools/memprobe/MemProbe.xcodeproj \
            -scheme MemProbe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log


      # GitHub serves raw job logs from a blob host that is unreachable from
      # some networks. Workflow-command annotations go through the API instead,
      # so the actual compiler errors stay readable without downloading logs.
      - name: Surface build errors as annotations
        if: failure()
        run: |
          echo "::group::compiler errors"
          grep -E "error:|error MT|The following build commands failed" build.log \
            | sed 's/[[:space:]]*$//' | sort -u | head -30 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          echo "::endgroup::"
          tail -n 40 build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build-ios -name 'MemProbe.app' -type d -path '*Release-iphoneos*' | head -n1)
          [ -n "$APP" ] || { echo "No .app produced"; exit 1; }
          # The extension is the entire point of this app. If PlugIns is missing
          # the build silently measures nothing, so fail loudly here instead.
          [ -d "$APP/PlugIns" ] || { echo "PlugIns missing -- extension was not embedded"; exit 1; }
          ls "$APP/PlugIns"
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry MemProbe-unsigned.ipa Payload
          unzip -l MemProbe-unsigned.ipa | tail -n 3

      - uses: actions/upload-artifact@v4
        with:
          name: MemProbe-unsigned-${{ github.sha }}
          path: MemProbe-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7
