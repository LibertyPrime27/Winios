# Builds the MemProbe measurement app for iOS and publishes an UNSIGNED .ipa.
# Sign it locally with Sideloadly / AltServer / SideStore using your own Apple ID.
#
# Free and unlimited on PUBLIC repos. On private repos macOS burns included
# minutes at a 10x multiplier (2,000 free = 200 macOS minutes/month).

name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on the portable core: ~2 minutes on a free Linux runner
  # instead of ~20 on macOS. Most logic bugs get caught here.
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Build and test core
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-host -j"$(nproc)"
          ctest --test-dir build-host --output-on-failure

  ios:
    # Pinned, not macos-latest: a silent image bump changes the SDK underneath us.
    runs-on: macos-26
    timeout-minutes: 60
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # The CPU core has no Xcode project yet; compile it for iOS arm64 here so
      # Apple clang on arm64 checks it on every push, not just Linux gcc.
      - name: Build xcore for iOS arm64
        run: |
          cmake -S . -B build-xcore-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build build-xcore-ios --config Release --target xcore -- \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO 2>&1 | tail -n 5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec tools/memprobe/project.yml --project tools/memprobe

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project tools/memprobe/MemProbe.xcodeproj \
            -scheme MemProbe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log


      # GitHub serves raw job logs from a blob host that is unreachable from
      # some networks. Workflow-command annotations go through the API instead,
      # so the actual compiler errors stay readable without downloading logs.
      - name: Surface build errors as annotations
        if: failure()
        run: |
          echo "::group::compiler errors"
          grep -E "error:|error MT|The following build commands failed" build.log \
            | sed 's/[[:space:]]*$//' | sort -u | head -30 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          echo "::endgroup::"
          tail -n 40 build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build-ios -name 'MemProbe.app' -type d -path '*Release-iphoneos*' | head -n1)
          [ -n "$APP" ] || { echo "No .app produced"; exit 1; }
          # The extension is the entire point of this app. If PlugIns is missing
          # the build silently measures nothing, so fail loudly here instead.
          [ -d "$APP/PlugIns" ] || { echo "PlugIns missing -- extension was not embedded"; exit 1; }
          ls "$APP/PlugIns"
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry MemProbe-unsigned.ipa Payload
          unzip -l MemProbe-unsigned.ipa | tail -n 3

      - uses: actions/upload-artifact@v4
        with:
          name: MemProbe-unsigned-${{ github.sha }}
          path: MemProbe-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7
