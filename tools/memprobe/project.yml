# XcodeGen spec. Generate with:  xcodegen generate --spec tools/memprobe/project.yml
#
# Hand-written .xcodeproj files rot; this stays readable and diffable, and CI
# regenerates it from scratch on every build.
name: MemProbe
options:
  bundleIdPrefix: winios.memprobe
  deploymentTarget: { iOS: "15.0" }
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_OBJC_BRIDGING_HEADER: Shared/MemProbe-Bridging-Header.h
    # xcore and Zydis are built by CMake (see CI) into build-xcore-ios/.
    HEADER_SEARCH_PATHS: $(SRCROOT)/Shared $(SRCROOT)/../../core/include
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../build-xcore-ios/core $(SRCROOT)/../../build-xcore-ios/core/zydis $(SRCROOT)/../../build-xcore-ios/core/zydis/zycore
    OTHER_LDFLAGS: -lxcore_golden -lxcore -lsoftfloat -lZydis -lZycore
    # Unsigned by design -- signing happens locally with Sideloadly.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  MemProbe:
    type: application
    platform: iOS
    sources:
      - path: Host
        excludes: ["Shaders/**"]
      - path: Shared
      # d12mt output for the GPU probe. Kept as .msl so Xcode does not try to
      # link two `main0`s into one default.metallib; compiled on device.
      - path: Host/Shaders
        type: folder
        buildPhase: resources
    info: { path: Host/Info.plist }
    entitlements: { path: Host/Host.entitlements }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: winios.memprobe.app
    dependencies:
      - target: MemProbeExtension
        embed: true

  MemProbeExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Probe
      - path: Shared
    info: { path: Probe/Info.plist }
    entitlements: { path: Probe/Probe.entitlements }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: winios.memprobe.app.probe
