# XcodeGen spec. Generate with:  xcodegen generate --spec tools/memprobe/project.yml
#
# Hand-written .xcodeproj files rot; this stays readable and diffable, and CI
# regenerates it from scratch on every build.
name: winios
options:
  bundleIdPrefix: winios
  deploymentTarget: { iOS: "15.0" }
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_OBJC_BRIDGING_HEADER: Shared/winios-Bridging-Header.h
    # xcore and Zydis are built by CMake (see CI) into build-xcore-ios/.
    HEADER_SEARCH_PATHS: $(SRCROOT)/Shared $(SRCROOT)/../../core/include $(SRCROOT)/../../win32 $(SRCROOT)/../../tools/winrun $(SRCROOT)/../../tools/import
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../build-xcore-ios $(SRCROOT)/../../build-xcore-ios/core $(SRCROOT)/../../build-xcore-ios/core/zydis $(SRCROOT)/../../build-xcore-ios/core/zydis/zycore
    # The emulator core, which both targets need: the extension runs the
    # memory ladder and the JIT probes.
    #
    # winrun_lib and import_lib are NOT here. They belong to the app alone --
    # the extension exists to measure memory in a second process and does not
    # run guests, which is why it excludes winprobe.c. Putting them in the
    # shared settings made the extension link against libraries it has no use
    # for, and the first time one of them was missing it was the *extension*
    # that failed, which points at the wrong target entirely.
    OTHER_LDFLAGS: -lxcore_golden -lxcore -lsoftfloat -lZydis -lZycore
    # Unsigned by design -- signing happens locally with Sideloadly.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  winios:
    type: application
    platform: iOS
    sources:
      - path: Host
        excludes: ["Shaders/**"]
      - path: Shared
      # d12mt output for the GPU probe. Kept as .msl so Xcode does not try to
      # link two `main0`s into one default.metallib; compiled on device.
      - path: Host/Shaders
        type: folder
        buildPhase: resources
      # The mingw-w64-built Windows guests, so the device can run a real .exe.
      # A folder reference: they land in the bundle as win32/hello32.exe etc.
      - path: ../../tests/win32
        name: win32
        type: folder
        buildPhase: resources
    info: { path: Host/Info.plist }
    entitlements: { path: Host/Host.entitlements }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: winios.app
        # winrun_lib is the PE loader + kernel32/msvcrt: it lets the app run a
        # real Windows .exe, and must precede xcore, which it calls into.
        # import_lib is the importer (a zip reader, installer detection, a
        # drive diff); it calls winrun_lib to run a setup program, so it comes
        # first. -lz is zlib from the SDK, for the zip reader's inflate.
        # $(inherited) keeps the core libraries from the shared settings, and
        # they have to come after these.
        OTHER_LDFLAGS: -limport_lib -lwinrun_lib $(inherited) -lz
    dependencies:
      - target: winiosProbe
        embed: true

  winiosProbe:
    type: app-extension
    platform: iOS
    sources:
      - path: Probe
      # winprobe.c calls winrun_lib, which the extension does not link: the
      # extension exists to measure memory in a second process, not to run
      # guests.
      - path: Shared
        excludes: ["winprobe.c"]
    info: { path: Probe/Info.plist }
    entitlements: { path: Probe/Probe.entitlements }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: winios.app.probe
